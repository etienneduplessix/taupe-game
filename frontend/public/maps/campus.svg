<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1490" viewBox="0 0 1080 1490" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <g id="deskH">
      <g fill="#aab0bd">
        <rect x="4"  y="0"  width="18" height="11" rx="2"/>
        <rect x="34" y="0"  width="18" height="11" rx="2"/>
        <rect x="64" y="0"  width="18" height="11" rx="2"/>
        <rect x="94" y="0"  width="18" height="11" rx="2"/>
        <rect x="4"  y="29" width="18" height="11" rx="2"/>
        <rect x="34" y="29" width="18" height="11" rx="2"/>
        <rect x="64" y="29" width="18" height="11" rx="2"/>
        <rect x="94" y="29" width="18" height="11" rx="2"/>
      </g>
      <rect x="2" y="14" width="116" height="12" rx="3" fill="#cfd4dc"/>
    </g>
    <g id="deskV">
      <g fill="#aab0bd">
        <rect x="0"  y="4"  width="11" height="18" rx="2"/>
        <rect x="0"  y="34" width="11" height="18" rx="2"/>
        <rect x="0"  y="64" width="11" height="18" rx="2"/>
        <rect x="0"  y="94" width="11" height="18" rx="2"/>
        <rect x="29" y="4"  width="11" height="18" rx="2"/>
        <rect x="29" y="34" width="11" height="18" rx="2"/>
        <rect x="29" y="64" width="11" height="18" rx="2"/>
        <rect x="29" y="94" width="11" height="18" rx="2"/>
      </g>
      <rect x="14" y="2" width="12" height="116" rx="3" fill="#cfd4dc"/>
    </g>
    <pattern id="lockers" patternUnits="userSpaceOnUse" width="13" height="24">
      <rect x="1" y="1" width="11" height="22" rx="2" fill="#11545b" stroke="#2bc4d4" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background (unflipped) -->
  <rect x="0" y="0" width="1080" height="1490" fill="#0a0e17"/>

  <!-- Title (centered, unflipped) -->
  <text x="540" y="60" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="700">42 Prague Campus Map</text>

  <!-- ============ MIRRORED GEOMETRY ============ -->
  <g transform="translate(1080,0) scale(-1,1)">
    <!-- Building floor -->
    <rect x="128" y="95" width="824" height="1338" rx="16" fill="#0c1019"/>
    <rect x="128" y="95" width="824" height="1338" rx="16" fill="none"
          stroke="#3b4356" stroke-width="13" stroke-dasharray="56 7"/>
    <rect x="135" y="102" width="810" height="1324" rx="12" fill="none"
          stroke="#1b2030" stroke-width="3"/>

    <!-- INTERIOR WALLS -->
    <g stroke="#2a3142" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="428" y1="100" x2="428" y2="338"/>
      <line x1="720" y1="100" x2="720" y2="338"/>
      <line x1="428" y1="338" x2="720" y2="338"/>
      <line x1="428" y1="430" x2="428" y2="720"/>
      <line x1="720" y1="720" x2="720" y2="1240"/>
      <line x1="318" y1="1010" x2="318" y2="1420"/>
      <line x1="150" y1="1150" x2="318" y2="1150"/>
      <line x1="150" y1="1280" x2="318" y2="1280"/>
    </g>

    <!-- Angled conference-room walls -->
    <g stroke="#3b4356" stroke-width="8" fill="none" stroke-linecap="round">
      <line x1="135" y1="300" x2="360" y2="118"/>
      <line x1="945" y1="1230" x2="720" y2="1412"/>
    </g>

    <!-- CENTRAL STRUCTURE (stairwells / WC) — text removed; placed unflipped below -->
    <g>
      <rect x="440" y="350" width="222" height="86" rx="6" fill="#39414f"/>
      <line x1="514" y1="350" x2="514" y2="436" stroke="#0c1019" stroke-width="4"/>
      <line x1="588" y1="350" x2="588" y2="436" stroke="#0c1019" stroke-width="4"/>
      <rect x="440" y="600" width="222" height="100" rx="6" fill="#39414f"/>
      <line x1="514" y1="600" x2="514" y2="700" stroke="#0c1019" stroke-width="4"/>
      <line x1="588" y1="600" x2="588" y2="700" stroke="#0c1019" stroke-width="4"/>
      <rect x="440" y="812" width="226" height="366" rx="6" fill="#39414f"/>
      <line x1="440" y1="858" x2="666" y2="858" stroke="#0c1019" stroke-width="4"/>
      <line x1="553" y1="812" x2="553" y2="858" stroke="#0c1019" stroke-width="4"/>
    </g>

    <!-- DESK CLUSTERS -->
    <g>
      <use href="#deskV" transform="translate(442,118)"/>
      <use href="#deskV" transform="translate(497,118)"/>
      <use href="#deskV" transform="translate(552,118)"/>
      <use href="#deskV" transform="translate(607,118)"/>
      <use href="#deskV" transform="translate(662,118)"/>
    </g>
    <g>
      <use href="#deskH" transform="translate(766,150) scale(0.8)"/>
      <use href="#deskH" transform="translate(800,236) scale(0.8)"/>
      <use href="#deskH" transform="translate(806,322) scale(0.8)"/>
      <use href="#deskH" transform="translate(800,408) scale(0.8)"/>
      <use href="#deskH" transform="translate(800,470) scale(0.8)"/>
    </g>
    <g>
      <use href="#deskH" transform="translate(176,348) scale(1.25,1.25)"/>
      <use href="#deskH" transform="translate(176,408) scale(1.25,1.25)"/>
      <use href="#deskH" transform="translate(176,468) scale(1.25,1.25)"/>
      <use href="#deskH" transform="translate(176,528) scale(1.25,1.25)"/>
      <use href="#deskH" transform="translate(176,588) scale(1.25,1.25)"/>
    </g>
    <g>
      <use href="#deskV" transform="translate(764,1044) scale(1,1.4)"/>
      <use href="#deskV" transform="translate(818,1044) scale(1,1.4)"/>
      <use href="#deskV" transform="translate(872,1044) scale(1,1.4)"/>
    </g>
    <g>
      <use href="#deskH" transform="translate(436,1366)"/>
      <use href="#deskH" transform="translate(562,1366)"/>
    </g>
    <g>
      <use href="#deskH" transform="translate(744,848) scale(1.25,1.05)"/>
    </g>

    <!-- LOCKERS -->
    <rect x="190" y="686" width="190" height="24" rx="3" fill="url(#lockers)"/>
    <rect x="744" y="966" width="196" height="24" rx="3" fill="url(#lockers)"/>

    <!-- SMALL AUDITORIUM -->
    <g>
      <rect x="176" y="782" width="9" height="150" rx="4" fill="#cfd4dc"/>
      <g fill="none" stroke="#aab0bd" stroke-width="11" stroke-linecap="round" stroke-dasharray="11 9">
        <path d="M 300 800 A 96 96 0 0 0 300 940"/>
        <path d="M 320 808 A 80 80 0 0 0 320 932"/>
        <path d="M 340 816 A 64 64 0 0 0 340 924"/>
        <path d="M 360 824 A 48 48 0 0 0 360 916"/>
      </g>
    </g>

    <!-- ICON SHAPES (teal accents) — text removed; placed unflipped below -->
    <g fill="#2bc4d4">
      <!-- conference bubble TL -->
      <g transform="translate(245,172)">
        <rect x="-24" y="-19" width="48" height="36" rx="11"/>
        <path d="M -14 14 L -4 14 L -16 26 Z"/>
        <g fill="#0a0e17">
          <rect x="-13" y="-10" width="26" height="3.5" rx="1.5"/>
          <rect x="-13" y="-2"  width="20" height="3.5" rx="1.5"/>
          <rect x="-13" y="6"   width="23" height="3.5" rx="1.5"/>
        </g>
      </g>
      <!-- conference bubble BR -->
      <g transform="translate(852,1378)">
        <rect x="-24" y="-19" width="48" height="36" rx="11"/>
        <path d="M -14 14 L -4 14 L -16 26 Z"/>
        <g fill="#0a0e17">
          <rect x="-13" y="-10" width="26" height="3.5" rx="1.5"/>
          <rect x="-13" y="-2"  width="20" height="3.5" rx="1.5"/>
          <rect x="-13" y="6"   width="23" height="3.5" rx="1.5"/>
        </g>
      </g>
      <!-- Cluster number circles -->
      <circle cx="455" cy="278" r="23"/>
      <circle cx="362" cy="498" r="23"/>
      <circle cx="772" cy="305" r="23"/>
      <circle cx="712" cy="1178" r="23"/>
      <circle cx="548" cy="1312" r="23"/>

      <!-- Lockers (key icons) -->
      <g transform="translate(214,667)">
        <circle cx="-6" cy="0" r="7" fill="none" stroke="#2bc4d4" stroke-width="4"/>
        <rect x="0" y="-2" width="15" height="4"/>
        <rect x="9" y="2" width="3.5" height="6"/>
        <rect x="14" y="2" width="3.5" height="8"/>
      </g>
      <g transform="translate(748,1010)">
        <circle cx="-6" cy="0" r="7" fill="none" stroke="#2bc4d4" stroke-width="4"/>
        <rect x="0" y="-2" width="15" height="4"/>
        <rect x="9" y="2" width="3.5" height="6"/>
        <rect x="14" y="2" width="3.5" height="8"/>
      </g>

      <!-- Elevators -->
      <g transform="translate(490,742)">
        <rect x="-15" y="-16" width="30" height="32" rx="4" fill="none" stroke="#2bc4d4" stroke-width="3.5"/>
        <path d="M 0 -10 L 7 -2 L -7 -2 Z"/>
        <path d="M 0 10 L 7 2 L -7 2 Z"/>
      </g>

      <!-- Kitchen (fork & knife) -->
      <g transform="translate(810,762)">
        <rect x="-12" y="-16" width="3.5" height="32" rx="1.5"/>
        <rect x="-12" y="-16" width="3.5" height="10"/>
        <rect x="-7" y="-16" width="3" height="10"/>
        <rect x="-17" y="-16" width="3" height="10"/>
        <rect x="-17" y="-7" width="9" height="3"/>
        <path d="M 10 -16 q 8 4 8 16 l -8 0 Z"/>
        <rect x="8" y="-2" width="3.5" height="18" rx="1.5"/>
      </g>

      <!-- You are here pin -->
      <g transform="translate(680,898)">
        <path d="M 0 0 C -13 0 -13 16 0 34 C 13 16 13 0 0 0 Z" fill="#f5b53d"/>
        <circle cx="0" cy="12" r="6" fill="#0a0e17"/>
      </g>

      <!-- Co-working laptop -->
      <g transform="translate(218,1068)">
        <path d="M -14 -10 L 14 -10 L 18 8 L -18 8 Z" fill="none" stroke="#2bc4d4" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="-22" y="9" width="44" height="6" rx="3"/>
      </g>

      <!-- Server room -->
      <g transform="translate(196,1192)">
        <rect x="-18" y="-18" width="36" height="11" rx="2"/>
        <rect x="-18" y="-4"  width="36" height="11" rx="2"/>
        <rect x="-18" y="10"  width="36" height="11" rx="2"/>
        <circle cx="11" cy="-12.5" r="2.2" fill="#0a0e17"/>
        <circle cx="11" cy="1.5"   r="2.2" fill="#0a0e17"/>
        <circle cx="11" cy="15.5"  r="2.2" fill="#0a0e17"/>
      </g>

      <!-- The Bocal rocket -->
      <g transform="translate(255,1318)">
        <path d="M 0 -26 C 12 -14 12 6 0 18 C -12 6 -12 -14 0 -26 Z"/>
        <path d="M -10 6 L -20 20 L -6 14 Z"/>
        <path d="M 10 6 L 20 20 L 6 14 Z"/>
        <circle cx="0" cy="-8" r="5" fill="#0a0e17"/>
      </g>
    </g>
  </g>

  <!-- ============ TEXT LABELS (unflipped, with mirrored x positions) ============ -->
  <!-- WC -->
  <text x="527" y="1018" text-anchor="middle" fill="#b9c0cd" font-size="78" font-weight="700">WC</text>

  <!-- Cluster number badges (text only — circles are mirrored above) -->
  <g fill="#0a0e17" font-size="28" font-weight="700" text-anchor="middle">
    <text x="625" y="287">1</text>
    <text x="718" y="507">1</text>
    <text x="308" y="314">3</text>
    <text x="368" y="1187">2</text>
    <text x="532" y="1321">2</text>
  </g>

  <!-- Conference room labels -->
  <g fill="#cdd3dd" font-size="20" font-style="italic" text-anchor="middle">
    <text x="845" y="266">conference room</text>
    <text x="232" y="1320">conference room</text>
  </g>

  <!-- Room labels -->
  <g fill="#ffffff" font-size="22">
    <text x="625" y="322" text-anchor="middle">Cluster</text>
    <text x="718" y="542" text-anchor="middle">Cluster</text>
    <text x="308" y="350" text-anchor="middle">Cluster</text>
    <text x="368" y="1222" text-anchor="middle">Cluster</text>
    <text x="532" y="1356" text-anchor="middle">Cluster</text>
    <text x="780" y="672" text-anchor="end">Lockers</text>
    <text x="264" y="1015" text-anchor="end">Lockers</text>
    <text x="534" y="748" text-anchor="end">Elevators</text>
    <text x="270" y="808" text-anchor="middle">Kitchen</text>
    <text x="358" y="906" text-anchor="end">YOU</text>
    <text x="358" y="930" text-anchor="end">are here</text>
    <text x="862" y="1098" text-anchor="middle">Co-working</text>
    <text x="832" y="1186" text-anchor="end">Server</text>
    <text x="832" y="1210" text-anchor="end">room</text>
    <text x="825" y="1370" text-anchor="middle">&#8220;The Bocal&#8221;</text>
    <text x="855" y="965" text-anchor="middle">Small</text>
    <text x="855" y="989" text-anchor="middle">auditorium</text>
  </g>
</svg>
